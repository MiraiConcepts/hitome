# Local same-origin dev proxy for hitome (see Caddyfile header for usage).
# `docker compose` derives its project name from this directory, which is also
# called dev-proxy in mitsume — without an explicit name, bringing one stack up
# destroys the other's containers.
name: hitome-dev-proxy

services:
  dev-proxy:
    container_name: hitome-dev-proxy
    image: caddy:2-alpine
    ports:
      - '8882:8882'
    environment:
      # From tooling/dev-proxy/.env (gitignored; see .env.example).
      RADICALE_ORIGIN: ${RADICALE_ORIGIN:?set RADICALE_ORIGIN in tooling/dev-proxy/.env}
      RADICALE_BASIC_B64: ${RADICALE_BASIC_B64:?set RADICALE_BASIC_B64 in tooling/dev-proxy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    extra_hosts:
      # Lets the container reach the Mac (Metro on :8082); works on colima and
      # Docker Desktop alike.
      - host.docker.internal:host-gateway
