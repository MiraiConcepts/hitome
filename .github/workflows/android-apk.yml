name: Android APK

# Builds the release APK on real x86_64 Linux, signs it, and publishes the
# GitHub Release Obtainium tracks — a tag is the whole release (reversed
# 2026-09-03; see docs/Release.md). The signing keystore lives in the repo
# secret KEYSTORE_BASE64, the Memoka model.
#
# The unsigned APK is still uploaded as an artifact, so
# tooling/android-builder/sign-release.sh remains a working fallback for a run
# whose signing step failed or a release that needs re-cutting by hand.
#
# No server URL or login is in the app: Android hitome uses the phone's
# calendars, which DAVx⁵ syncs (it holds the login).

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    # Web-only releases (tags like v0.2.6-web.1) skip the APK — the web image
    # workflow still runs. Next full release re-syncs both channels.
    if: ${{ !contains(github.ref_name, '-web') }}
    runs-on: ubuntu-latest
    # Creating the Release needs write; nothing else here does.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Install dependencies
        working-directory: app
        run: bun install --frozen-lockfile

      - name: Prebuild android project
        working-directory: app
        run: bunx expo prebuild --platform android --no-install

      - name: Strip signing (signed locally after download)
        run: node tooling/android-builder/patch-signing.mjs app/android/app/build.gradle --unsigned

      # arm64-v8a only. New Architecture builds C++ from source once per ABI,
      # so the default four-ABI universal APK pays that cost three extra times
      # for architectures nothing here runs: the phone is arm64, and so is the
      # emulator (Apple Silicon host). Passed as a flag rather than edited into
      # gradle.properties, which expo prebuild regenerates — and which local
      # `android:dev` builds should keep reading unchanged.
      - name: Build release APK (unsigned, arm64-v8a)
        working-directory: app/android
        run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a

      - name: Zipalign + stage signing tool
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          VERSION=$(bun -e 'console.log(JSON.parse(require("fs").readFileSync("app/app.json","utf8")).expo.version)')
          "$BT/zipalign" -f 4 \
            app/android/app/build/outputs/apk/release/app-release-unsigned.apk \
            "hitome-v$VERSION-unsigned.apk"
          cp "$BT/lib/apksigner.jar" .
          echo "built hitome-v$VERSION-unsigned.apk (aligned)"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hitome-unsigned-apk
          path: |
            hitome-v*-unsigned.apk
            apksigner.jar
          if-no-files-found: error
          retention-days: 30

      # Everything below only runs for a tag. A workflow_dispatch smoke build
      # still stops at the unsigned artifact and publishes nothing.
      - name: Decode keystore
        if: startsWith(github.ref, 'refs/tags/')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "KEYSTORE_BASE64 is not set"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore

      - name: Sign
        if: startsWith(github.ref, 'refs/tags/')
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          TAG: ${{ github.ref_name }}
        run: |
          java -jar apksigner.jar sign \
            --ks release.keystore --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" --key-pass "pass:$KEY_PASSWORD" \
            --out "hitome-$TAG.apk" "hitome-$TAG-unsigned.apk"

      # The signature is real. (The companion check — that a server URL got
      # baked into the APK — is gone with the baking: the app is configured on
      # the device now, so a release with no URL in it is the correct outcome.)
      - name: Verify signature
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: java -jar apksigner.jar verify --print-certs "hitome-$TAG.apk" | head -3

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" "hitome-$TAG.apk" \
            --title "hitome $TAG" --generate-notes

      - name: Shred the keystore
        if: always()
        run: rm -f release.keystore
