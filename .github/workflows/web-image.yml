name: Web image

# Build the web app and its server into ghcr.io/miraiconcepts/hitome:latest on every release
# tag (v*) — the same trigger as the Android APK workflow, so web and Android
# always ship the same versioned commit. Watchtower on the server polls GHCR
# and redeploys automatically (see docs/Deploy.md, docs/Release.md).
#
# CREDENTIAL-FREE: no secrets are used or needed. People log in on the page;
# hitome's server keeps each login in its own data volume (see docs/Deploy.md).
# Built for Intel/AMD and ARM (Raspberry Pi and the like).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: app
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/miraiconcepts/hitome:latest
            ghcr.io/miraiconcepts/hitome:${{ github.ref_name }}
