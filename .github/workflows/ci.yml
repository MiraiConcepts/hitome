name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint -- --max-warnings 0

      - name: Format check
        run: bun run format:check

      - name: Test
        run: bun run test -- --ci

      # hitome's web server runs on Bun (app/server), so its tests run there
      # rather than under jest's React Native preset.
      - name: Test server
        run: bun run test:server

  # The web app end to end (tooling/e2e): Metro serving the web build on :8082,
  # a throwaway Radicale behind its own Caddy, Playwright in Docker. The same
  # run.sh used locally; the real calendar is never touched.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      # Metro runs under real node (see CLAUDE.md: bun breaks its watcher).
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: app
        run: bun install --frozen-lockfile

      - name: Start the web dev server
        working-directory: app
        env:
          CI: '1'
        run: |
          nohup bun run web:proxy > metro.log 2>&1 &
          for i in $(seq 1 90); do
            curl -sf -o /dev/null http://localhost:8082 && break
            sleep 2
          done
          curl -sf -o /dev/null http://localhost:8082 || { cat metro.log; exit 1; }
          # The page answers before its bundle is built; a cold bundle takes
          # ~30s on a runner, longer than the specs wait for the first screen.
          # Build it now, from the script tag the page itself asks for.
          bundle=$(curl -sf http://localhost:8082 | grep -oE 'src="/[^"]+\.bundle[^"]*"' | head -1 | sed 's/^src="//; s/"$//; s/&amp;/\&/g')
          curl -sf -o /dev/null --max-time 300 "http://localhost:8082$bundle"

      - name: Run e2e
        working-directory: tooling/e2e
        run: ./run.sh

      - name: Metro log on failure
        if: failure()
        run: tail -100 app/metro.log

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: e2e-results
          path: |
            tooling/e2e/test-results
            tooling/e2e/artifacts
          retention-days: 7
